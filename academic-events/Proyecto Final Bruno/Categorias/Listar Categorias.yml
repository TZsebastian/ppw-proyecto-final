info:
  name: Listar Categorias
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/api/categories?active=true&page=0&size=10
  params:
    - name: active
      value: "true"
      type: query
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
