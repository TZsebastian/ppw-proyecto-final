spring:
  application:
    name: academic-events

  datasource:
    url: jdbc:postgresql://localhost:5432/academic_events_db
    username: ups
    password: ups123

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  issuer: academic-events-api
  header: Authorization
  prefix: "Bearer "

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

swagger:
  security:
    enabled: ${SWAGGER_SECURITY_ENABLED:false}
    username: ${SWAGGER_USERNAME:}
    password: ${SWAGGER_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never
      show-components: never

  health:
    redis:
      enabled: true
    db:
      enabled: true