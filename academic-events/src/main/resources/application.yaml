spring:
  application:
    name: academic-events

  datasource:
    url: jdbc:postgresql://localhost:5432/academic_events_db
    username: ups
    password: ups123

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080