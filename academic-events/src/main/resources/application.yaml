spring:
  application:
    name: academic-events

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/academic_events_db}
    username: ${DB_USERNAME:ups}
    password: ${DB_PASSWORD:ups123}

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  issuer: academic-events-api
  header: Authorization
  prefix: "Bearer "

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

swagger:
  security:
    enabled: ${SWAGGER_SECURITY_ENABLED:false}
    username: ${SWAGGER_USERNAME:}
    password: ${SWAGGER_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never
      show-components: never

  health:
    redis:
      enabled: true
    db:
      enabled: true